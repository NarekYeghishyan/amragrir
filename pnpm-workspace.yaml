packages:
  - "apps/*"
  - "packages/*"

# Allow these dependencies to run their install scripts (pnpm blocks them by
# default). Prisma needs its postinstall to fetch the query engine and generate
# the client; esbuild needs its to place the platform binary Vite runs; sharp
# needs its to fetch the native binary Next.js optimises images with.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
